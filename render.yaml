services:
  - type: web
    name: synapse-earth-global
    runtime: python
    plan: free

    # Keep the free 512 MB instance lightweight. Regional map extraction is
    # intentionally disabled on the web server; map packages must be managed
    # separately rather than downloaded/processed during every deployment.
    buildCommand: pip install -r requirements.txt
    startCommand: python -m synapse.server

    envVars:
      - key: SYNAPSE_PREFETCH
        value: "off"
      - key: SYNAPSE_ALLOW_INSTALL
        value: "0"
      - key: TAVILY_API_KEY
        sync: false
      - key: BIFROST_URL
        sync: false
      - key: BIFROST_MODELS
        sync: false
